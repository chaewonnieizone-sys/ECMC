<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | EC Marketing Corporation</title>
    <link rel="icon" href="images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" onerror="this.remove()">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-mobile-bar">
  <div id="layout-header"></div>
  <div id="layout-cart-offcanvas"></div>

<main id="main" class="py-4"><div class="container">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Cart</li></ol></nav>
    <section class="page-title-card mb-4">
      <span class="page-title-card__label">Your Cart</span>
      <h1 class="page-title-card__title">Shopping Cart</h1>
      <p class="page-title-card__text">Review your items and proceed to place your order.</p>
    </section>
    <div class="row g-4">
      <div class="col-lg-8"><div id="cartItems"></div></div>
      <div class="col-lg-4"><div class="card"><div class="card-body"><h2 class="h5">Summary</h2><p id="cartSubtotal" class="fw-semibold mb-2"></p><p class="small text-body-secondary">Free delivery and cash on delivery, terms confirmed by the shop.</p><div class="d-grid gap-2"><a href="checkout.html" class="btn btn-primary" id="checkoutBtn">Proceed to checkout</a><a href="shop.html" class="btn btn-outline-primary">Continue shopping</a><button type="button" class="btn btn-outline-danger" id="clearCartBtn">Clear cart</button></div></div></div></div>
    </div>
  </div></main>

  <div id="layout-footer"></div>
  <div id="layout-mobile-bar"></div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'"></script>
  <script src="js/products.js"></script><script src="js/store.js"></script><script src="js/cart.js"></script><script src="js/layout.js"></script><script src="js/main.js"></script>
  <script>
    var yearEl = document.getElementById('year'); if (yearEl) yearEl.textContent = new Date().getFullYear();
    function renderCartPage(){
      var cart = ECMCart.getCart();
      var wrap = document.getElementById('cartItems');
      var subEl = document.getElementById('cartSubtotal');
      var checkoutBtn = document.getElementById('checkoutBtn');
      wrap.innerHTML = '';
      if (!cart.length) {
        wrap.innerHTML = '<div class="alert alert-info">Your cart is empty. <a href="shop.html" class="alert-link">Browse products</a>.</div>';
        subEl.textContent = 'Subtotal: ₱0.00';
        checkoutBtn.classList.add('disabled');
        checkoutBtn.setAttribute('aria-disabled','true');
        return;
      }
      checkoutBtn.classList.remove('disabled');
      checkoutBtn.removeAttribute('aria-disabled');
      var list = document.createElement('div'); list.className='list-group';
      cart.forEach(function(item){
        var r = ECMCart.resolveItem(item);
        var p = r.product, d = r.resolved;
        var name = d ? d.name : "Unknown product";
        var variant = d && d.variantLabel ? d.variantLabel : (d ? d.size : (p ? p.size : ""));
        var brand = d ? (d.brand || "") : (p ? p.brand : "");
        var line = (d && d.price !== null && d.price !== undefined) ? formatPeso(Number(d.price) * item.qty) : "Ask for price";
        var unit = d ? formatPeso(d.price) : "Ask for price";
        var row = document.createElement("div"); row.className="list-group-item";
        row.innerHTML = '<div class="row g-3 align-items-center"><div class="col-3 col-md-2"><img src="'+(d?d.image:(p?p.image:"images/placeholder-hardware.jpg"))+'" alt="" class="img-fluid rounded border placeholder-img"></div><div class="col-9 col-md-4"><h2 class="h6 mb-1"></h2><p class="small text-body-secondary mb-1"></p><p class="small mb-0"></p></div><div class="col-6 col-md-3"><div class="input-group input-group-sm"><button class="btn btn-outline-secondary" type="button" aria-label="Decrease quantity">−</button><input type="number" class="form-control text-center" min="1" value="'+item.qty+'" aria-label="Quantity"><button class="btn btn-outline-secondary" type="button" aria-label="Increase quantity">+</button></div></div><div class="col-4 col-md-2 fw-semibold"></div><div class="col-2 col-md-1 text-end"><button class="btn btn-sm btn-outline-danger" type="button" aria-label="Remove item">×</button></div></div>';
        row.querySelector("img").alt = name;
        row.querySelector("h2").textContent = name;
        row.querySelectorAll(".small")[0].textContent = brand + (variant ? " · " + variant : "");
        row.querySelectorAll(".small")[1].textContent = unit;
        row.querySelector(".fw-semibold").textContent = line;
        var btns = row.querySelectorAll("button");
        var input = row.querySelector("input");
        btns[0].addEventListener("click", function(){ ECMCart.updateQty(item.id, item.qty - 1, item.selections); renderCartPage(); ECMUI.renderOffcanvasCart(); });
        btns[1].addEventListener("click", function(){ ECMCart.updateQty(item.id, item.qty + 1, item.selections); renderCartPage(); ECMUI.renderOffcanvasCart(); });
        btns[2].addEventListener("click", function(){ ECMCart.removeFromCart(item.id, item.selections); renderCartPage(); ECMUI.renderOffcanvasCart(); ECMUI.showToast("Removed from cart"); });
        input.addEventListener("change", function(){ ECMCart.updateQty(item.id, parseInt(input.value,10)||1, item.selections); renderCartPage(); ECMUI.renderOffcanvasCart(); });
        list.appendChild(row);
      });
      wrap.appendChild(list);
      var sub = ECMCart.cartSubtotal();
      subEl.textContent = sub === null ? 'Prices will be confirmed by the shop.' : ('Subtotal: ' + formatPeso(sub));
    }
    document.addEventListener('DOMContentLoaded', function(){
      renderCartPage();
      document.getElementById('clearCartBtn').addEventListener('click', function(){ ECMCart.clearCart(); renderCartPage(); ECMUI.renderOffcanvasCart(); ECMUI.showToast('Cart cleared'); });
    });
  </script>
</body>
</html>
