<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Login | EC Marketing Corporation</title>
  <meta name="description" content="Staff login for EC Marketing Corporation.">
  <link rel="icon" href="../images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" onerror="this.remove()">
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script defer src="../js/products.js"></script>
  <script defer src="../js/main.js"></script>
  <script defer src="../js/admin.js"></script>
</head>
<body data-admin-page="login" class="admin-login-page">
  <div class="top-strip" aria-hidden="true"></div>
  <main class="min-vh-100 d-flex align-items-center py-5">
    <div class="container" style="max-width: 480px;">
      <div class="text-center mb-4">
        <a href="../index.html" class="d-inline-block mb-2"><img src="../images/logo.jpg" alt="EC Marketing Corporation" width="180" height="48"></a>
        <p class="eyebrow mb-1">EC Marketing Corporation</p>
        <h1 class="h3 mb-1">Staff Login</h1>
        <p class="text-body-secondary small mb-0">Sign in to manage orders, inventory, and customer requests.</p>
      </div>
      <div class="card dashboard-panel shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
          <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control form-control-lg" id="username" name="username" autocomplete="username" required>
              <div class="invalid-feedback">Username is required.</div>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="current-password" required>
              <div class="invalid-feedback">Password is required.</div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
          </form>
        </div>
      </div>
      <p class="text-center small text-body-secondary mt-3 mb-0"><a href="../index.html" class="text-decoration-none fw-semibold">← Back to storefront</a></p>
    </div>
  </main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" onerror="void 0"></script>
</body>
</html>
