<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Admin | EC Marketing Corporation</title>
  <meta name="description" content="View customer feedback for EC Marketing Corporation.">
  <link rel="icon" href="../images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" onerror="this.remove()">
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script defer src="../js/products.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/main.js"></script>
  <script defer src="../js/admin.js"></script>
</head>
<body data-admin-page="feedback">
  <div id="layout-header"></div>

  <main class="py-4 admin-main">
    <div class="container-xl">
    <section class="page-title-card page-title-card--charcoal mb-4">
      <span class="page-title-card__label">Insights</span>
      <h1 class="page-title-card__title">Customer Feedback</h1>
      <p class="page-title-card__text">Review ratings and comments submitted by customers.</p>
    </section>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card dashboard-panel mb-3"><div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3"><div><div class="small text-body-secondary text-uppercase fw-semibold">Average rating</div><div class="fs-4 fw-bold text-warning-emphasis" id="feedbackAvg">No feedback yet</div></div><div class="kpi-icon text-warning mb-0"><i class="bi bi-star-half"></i></div></div></div>
        <div id="feedbackList"></div>
      </div>
      <div class="col-lg-4">
        <div class="card dashboard-panel"><div class="card-header"><h2 class="h6 mb-0">Average by service type</h2></div><ul class="list-group list-group-flush" id="feedbackByService"><li class="list-group-item text-body-secondary">No data yet.</li></ul></div>
      </div>
    </div>
  </div></main>

  <div id="layout-footer"></div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" onerror="void 0"></script>
</body>
</html>
