<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | EC Marketing Corporation</title>
  <meta name="description" content="Browse construction materials, water tanks, power tools, and hardware & paint from EC Marketing Corporation.">
    <link rel="icon" href="images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" onerror="this.remove()">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-mobile-bar">
  <div id="layout-header"></div>
  <div id="layout-cart-offcanvas"></div>

  <main id="main" class="py-4">
    <div class="container">
      <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Shop</li></ol></nav>
      <section class="page-title-card mb-4">
        <span class="page-title-card__label">Our Products</span>
        <h1 class="page-title-card__title">Shop Construction & Hardware Supplies</h1>
        <p class="page-title-card__text">Browse materials, tools, tanks, and hardware for your project needs.</p>
      </section>
      <div class="row g-4">
        <aside class="col-lg-3 d-none d-lg-block">
          <div class="card"><div class="card-body">
            <h2 class="h5">Filters</h2>
            <div id="filtersDesktop"></div>
          </div></div>
        </aside>
        <section class="col-lg-9">
          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <div id="productCount" class="text-body-secondary small"></div>
            <div class="d-flex align-items-center gap-2"><label for="sortSelect" class="form-label mb-0 small">Sort</label><select id="sortSelect" class="form-select form-select-sm" style="width:auto"><option value="name">Name (A–Z)</option><option value="category">Category</option><option value="brand">Brand</option></select></div>
          </div>
          <div class="row g-3" id="productGrid"></div>
          <nav class="mt-4" aria-label="Product pages"><ul class="pagination justify-content-center" id="pagination"></ul></nav>
        </section>
      </div>
    </div>
  </main>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="filterOffcanvas" aria-labelledby="filterOffcanvasLabel">
    <div class="offcanvas-header"><h2 class="offcanvas-title h5" id="filterOffcanvasLabel">Filters</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button></div>
    <div class="offcanvas-body"><div id="filtersMobile"></div></div>
  </div>

  <div id="layout-footer"></div>
  <div id="layout-mobile-bar"></div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'"></script>
  <script src="js/products.js"></script><script src="js/store.js"></script><script src="js/cart.js"></script><script src="js/layout.js"></script><script src="js/main.js"></script>
  <script>
    var yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
    (function(){
      var state = { search:'', category:'', brand:'', audience:'', sort:'name', page:1, perPage:12 };
      var params = new URLSearchParams(location.search);
      state.category = params.get('category') || '';
      var categories = Array.from(new Set(getProductsList().map(function(p){return p.category;}))).sort();
      var brands = Array.from(new Set(getProductsList().map(function(p){return p.brand;}))).sort();
      var audiences = Array.from(new Set(getProductsList().reduce(function(a,p){return a.concat(p.audience||[]);},[]))).sort();

      function filterForm(prefix){
        var wrap = document.createElement('div');
        wrap.innerHTML = ''
          + '<div class="mb-3"><label class="form-label" for="'+prefix+'Search">Search</label><input id="'+prefix+'Search" class="form-control" type="search" placeholder="Product name or brand"></div>'
          + '<div class="mb-3"><label class="form-label" for="'+prefix+'Category">Category</label><select id="'+prefix+'Category" class="form-select"><option value="">All categories</option>'+categories.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('')+'</select></div>'
          + '<div class="mb-3"><label class="form-label" for="'+prefix+'Brand">Brand</label><select id="'+prefix+'Brand" class="form-select"><option value="">All brands</option>'+brands.map(function(b){return '<option value="'+b+'">'+b+'</option>';}).join('')+'</select></div>'
          + '<div class="mb-3"><label class="form-label" for="'+prefix+'Audience">Audience</label><select id="'+prefix+'Audience" class="form-select"><option value="">All audiences</option>'+audiences.map(function(a){return '<option value="'+a+'">'+a+'</option>';}).join('')+'</select></div>'
          + '<button type="button" class="btn btn-sm btn-outline-secondary" id="'+prefix+'Clear">Clear filters</button>';
        return wrap;
      }
      document.getElementById('filtersDesktop').appendChild(filterForm('d'));
      document.getElementById('filtersMobile').appendChild(filterForm('m'));

      function syncControls() {
        ['d','m'].forEach(function(p){
          document.getElementById(p+'Search').value = state.search;
          document.getElementById(p+'Category').value = state.category;
          document.getElementById(p+'Brand').value = state.brand;
          document.getElementById(p+'Audience').value = state.audience;
        });
        document.getElementById('sortSelect').value = state.sort;
      }
      function getFiltered() {
        var q = state.search.toLowerCase();
        var items = getProductsList().filter(function(p){
          var optText = (p.options||[]).map(function(o){return o.name+' '+(o.choices||[]).map(function(c){return c.label+' '+c.value;}).join(' ');}).join(' '); var matchQ = !q || (p.name+' '+p.brand+' '+p.category+' '+p.description+' '+(p.size||'')+' '+optText).toLowerCase().indexOf(q) !== -1;
          var matchC = !state.category || p.category === state.category;
          var matchB = !state.brand || p.brand === state.brand;
          var matchA = !state.audience || (p.audience||[]).indexOf(state.audience) !== -1;
          return matchQ && matchC && matchB && matchA;
        });
        items.sort(function(a,b){
          var ka = (a[state.sort]||'').toString().toLowerCase();
          var kb = (b[state.sort]||'').toString().toLowerCase();
          return ka < kb ? -1 : ka > kb ? 1 : a.name.localeCompare(b.name);
        });
        return items;
      }
      function render() {
        var items = getFiltered();
        var totalPages = Math.max(1, Math.ceil(items.length / state.perPage));
        if (state.page > totalPages) state.page = totalPages;
        var start = (state.page - 1) * state.perPage;
        var pageItems = items.slice(start, start + state.perPage);
        document.getElementById('productCount').textContent = items.length + ' product' + (items.length===1?'':'s') + ' found';
        var grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        if (!pageItems.length) {
          grid.innerHTML = '<div class="col-12"><div class="alert alert-warning mb-0">No products match your filters. Try clearing filters.</div></div>';
        } else {
          pageItems.forEach(function(p){
            var col = document.createElement('div'); col.className = 'col-6 col-md-4';
            var dr = (typeof resolveProduct === 'function') ? resolveProduct(p, {}) : p;
            var stock = p.inStock ? '<span class="badge text-bg-success">In stock</span>' : '<span class="badge text-bg-secondary">Coming soon</span>';
            var badge = p.badge ? '<span class="badge text-bg-warning">'+p.badge+'</span>' : '';
            var hasOpts = (typeof productHasOptions === 'function') && productHasOptions(p);
            var action = hasOpts
              ? '<button class="btn btn-sm btn-primary" type="button" data-quick-add="'+p.id+'" '+(p.inStock?'':'disabled')+'>Add to cart</button>'
              : '<button class="btn btn-sm btn-primary" type="button" data-add-to-cart="'+p.id+'" '+(p.inStock?'':'disabled')+'>Add to cart</button>';
            var sizeText = hasOpts ? 'Select options (brand, color, size, etc.)' : (p.size||'');
            var priceText = formatPeso(dr.price);
            col.innerHTML = '<div class="card h-100"><img src="'+(dr.image||p.image)+'" class="card-img-top placeholder-img" alt=""><div class="card-body d-flex flex-column"><div class="d-flex justify-content-between align-items-start gap-2 mb-1"><h3 class="h6 mb-0"></h3><div class="d-flex flex-column gap-1 align-items-end">'+badge+stock+'</div></div><p class="small text-body-secondary mb-1"></p><p class="small mb-1"></p><p class="fw-semibold mb-2"></p><div class="mt-auto d-grid gap-2"><a class="btn btn-sm btn-outline-primary" href="product.html?id='+encodeURIComponent(p.id)+'">View</a>'+action+'</div></div></div>';
            col.querySelector('img').alt = p.name;
            col.querySelector('h3').textContent = p.name;
            col.querySelectorAll('.small')[0].textContent = p.brand + ' · ' + p.category;
            col.querySelectorAll('.small')[1].textContent = sizeText;
            col.querySelector('.fw-semibold').textContent = hasOpts ? ('From ' + priceText) : priceText;
            grid.appendChild(col);
          });
        }
        var pag = document.getElementById('pagination'); pag.innerHTML='';
        for (var i=1;i<=totalPages;i++) {
          (function(pageNum){
            var li = document.createElement('li'); li.className='page-item'+(pageNum===state.page?' active':'');
            var a = document.createElement('a'); a.className='page-link'; a.href='#'; a.textContent=String(pageNum);
            if (pageNum===state.page) a.setAttribute('aria-current','page');
            a.addEventListener('click', function(e){ e.preventDefault(); state.page=pageNum; render(); window.scrollTo({top:0,behavior:'smooth'}); });
            li.appendChild(a); pag.appendChild(li);
          })(i);
        }
      }
      function bind(prefix){
        document.getElementById(prefix+'Search').addEventListener('input', function(e){ state.search=e.target.value; state.page=1; syncControls(); render(); });
        document.getElementById(prefix+'Category').addEventListener('change', function(e){ state.category=e.target.value; state.page=1; syncControls(); render(); });
        document.getElementById(prefix+'Brand').addEventListener('change', function(e){ state.brand=e.target.value; state.page=1; syncControls(); render(); });
        document.getElementById(prefix+'Audience').addEventListener('change', function(e){ state.audience=e.target.value; state.page=1; syncControls(); render(); });
        document.getElementById(prefix+'Clear').addEventListener('click', function(){ state.search=''; state.category=''; state.brand=''; state.audience=''; state.page=1; syncControls(); render(); });
      }
      bind('d'); bind('m');
      document.getElementById('sortSelect').addEventListener('change', function(e){ state.sort=e.target.value; render(); });
      syncControls(); render();
    })();
  </script>
</body>
</html>
